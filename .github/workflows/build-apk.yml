name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # publish the APK to the "latest" release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # default list includes the retired 'tools' package, which fails sdkmanager
          packages: 'platform-tools'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Run unit tests and build release APK
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: gradle testDebugUnitTest assembleRelease

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AnimeWave-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

      # Stable direct link for Downloader / browsers / the in-app updater:
      # https://github.com/<repo>/releases/download/latest/AnimeWave.apk (+ version.json)
      # Only builds signed with the permanent key are published, so updates always install in place.
      - name: Publish APK to the "latest" release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNED: ${{ secrets.SIGNING_PASSWORD != '' }}
        run: |
          if [ "$SIGNED" != "true" ]; then
            echo "::warning::SIGNING_PASSWORD secret not set; skipping publish so installed apps aren't broken by a differently signed APK."
            exit 0
          fi
          cp app/build/outputs/apk/release/app-release.apk AnimeWave.apk
          jq -n --argjson code "$GITHUB_RUN_NUMBER" --arg name "1.0.$GITHUB_RUN_NUMBER" --arg notes "$(git log -1 --format=%s)" \
            '{versionCode: $code, versionName: $name, notes: $notes}' > version.json
          gh release view latest >/dev/null 2>&1 || gh release create latest \
            --title "AnimeWave (latest build)" --target "$GITHUB_SHA" \
            --notes "APK from the newest commit on main. Direct link: https://github.com/${{ github.repository }}/releases/download/latest/AnimeWave.apk"
          # APK first, then version.json, so the app never sees a version whose APK isn't there yet.
          gh release upload latest AnimeWave.apk --clobber
          gh release upload latest version.json --clobber
