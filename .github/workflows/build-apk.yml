name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # publish the APK to the "latest" release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # default list includes the retired 'tools' package, which fails sdkmanager
          packages: 'platform-tools'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Run unit tests and build debug APK
        run: gradle testDebugUnitTest assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AnimeWave-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      # Stable direct link for Downloader / browsers:
      # https://github.com/<repo>/releases/download/latest/AnimeWave.apk
      - name: Publish APK to the "latest" release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk AnimeWave.apk
          gh release view latest >/dev/null 2>&1 || gh release create latest \
            --title "AnimeWave (latest build)" --target "$GITHUB_SHA" \
            --notes "Debug APK from the newest commit on main. Direct link: https://github.com/${{ github.repository }}/releases/download/latest/AnimeWave.apk"
          gh release upload latest AnimeWave.apk --clobber
