name: "Playback service tests"

on:
  push:
    branches: [main, feat/authorized-playback-layer]
    paths:
      - "playback-service/**"
      - ".github/workflows/playback-service.yml"
  pull_request:
    branches: [main]
    paths:
      - "playback-service/**"
      - ".github/workflows/playback-service.yml"
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: playback-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: 'npm'
          cache-dependency-path: playback-service/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Check backend syntax
        run: npm run check
      - name: Build React player
        run: npm run web:build
      - name: Run tests
        run: npm test
